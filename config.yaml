  id: "PLPTV0NXA_ZSgsLAr8YCgCwhPIJNNtexWu"

book:
  title: "Building Large Language Models from Scratch"
  subtitle: "A Comprehensive Guide from Fundamentals to Production"
  author: "Based on the YouTube Playlist by Andrej Karpathy et al."
  version: "1.0"

llm:
  model: "deepseek-chat"
  max_tokens: 4096
  chunk_size: 3000
  chunk_overlap: 200

paths:
