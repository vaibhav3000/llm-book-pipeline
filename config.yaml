  chapters_dir: "cache/chapters"
  output_dir: "output"
  manuscript_md: "output/manuscript.md"
  output_pdf: "output/Building_LLMs_from_Scratch.pdf"

pipeline:
  force_refetch: false
  force_rewrite: false
  max_videos: null
